<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Push-Up Tracker — OBS source</title>
    <style>
      /* Transparent to the bottom, like the text overlay: OBS composites the
         canvas straight over the scene, alpha channel and all. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        height: 100%;
      }

      #stage {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* The camera feed is drawn into the canvas, never shown directly. */
      #video {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      #readout {
        position: absolute;
        left: 16px;
        bottom: 12px;
        display: flex;
        align-items: baseline;
        gap: 0.25em;
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        color: var(--color, #fff);
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        line-height: 1;
        font-size: var(--size, 64px);
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }

      #label {
        font-size: 0.34em;
        font-weight: 700;
        letter-spacing: 0.04em;
        opacity: 0.95;
      }

      /* Errors need to be visible while you set the source up, but must never
         be the thing your viewers see, so it stays small and out of the way. */
      #status {
        position: absolute;
        left: 16px;
        top: 12px;
        max-width: calc(100% - 32px);
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(120, 20, 24, 0.9);
        color: #ffdcdc;
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        line-height: 1.4;
      }

      /* "Loading pose model…" and "Requesting camera…" are the source coming
         up, not a fault. Red for those trains you to ignore the red box. */
      #status[data-tone='info'] {
        background: rgba(16, 20, 26, 0.85);
        color: #d5dde6;
      }

      #settings-link {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 2;
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 10px;
        background: rgba(16, 20, 26, 0.82);
        color: #f4f7fa;
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        font-weight: 700;
        line-height: 1;
        text-decoration: none;
        backdrop-filter: blur(8px);
      }

      #settings-link:hover {
        background: rgba(32, 39, 48, 0.94);
      }

      #settings-link:focus-visible {
        outline: 2px solid #7dd3fc;
        outline-offset: 3px;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <video id="video" playsinline muted></video>
    <canvas id="stage"></canvas>

    <div id="readout">
      <span id="count">—</span>
      <span id="label" hidden>TO DO</span>
    </div>

    <div id="status" hidden></div>
    <a id="settings-link" href="camera.html" hidden>Settings</a>

    <script type="module">
      // Apply the text options before the module loads, so the counter never
      // flashes at the wrong size while the pose runtime is still downloading.
      const p = new URLSearchParams(location.search);
      const readout = document.getElementById('readout');
      const size = Number(p.get('size'));
      if (Number.isFinite(size) && size > 0) readout.style.setProperty('--size', `${size}px`);
      const color = p.get('color');
      if (color) readout.style.setProperty('--color', /^[0-9a-f]{3,8}$/i.test(color) ? `#${color}` : color);
      const label = p.get('label');
      if (label !== null) {
        const el = document.getElementById('label');
        el.textContent = label;
        el.dataset.custom = '1';
      }
    </script>
    <script type="module" src="/js/tracker.js"></script>
  </body>
</html>
