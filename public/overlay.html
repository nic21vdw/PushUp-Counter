<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Push-Up Counter — OBS overlay</title>
    <style>
      /* Transparent all the way down. OBS composites this straight over the
         scene, alpha channel and all — there is no colour to key out and no
         custom CSS to paste into the browser source. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        height: 100%;
      }

      /* The camera feed is never shown on stream. It is decoded into the pose
         model and, unless you ask for setup mode, drawn nowhere at all. */
      #video {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      /* Only ever visible in setup mode, so you can frame yourself once. */
      #stage {
        display: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      body[data-setup='1'] #stage {
        display: block;
      }

      #readout {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 0.1em;
        padding: 12px 16px;
        font-family: var(--font, 'Inter', 'Helvetica Neue', Arial, sans-serif);
        font-weight: var(--weight, 800);
        color: var(--color, #ffffff);
        text-shadow: var(--shadow, 0 2px 10px rgba(0, 0, 0, 0.75));
        line-height: 1.05;
        letter-spacing: -0.01em;
        text-align: var(--align, left);
        align-items: var(--items, flex-start);
        justify-content: flex-start;
        -webkit-font-smoothing: antialiased;
        /* Held back until the URL options have been applied, so the number
           never flashes at the wrong size while the module loads. */
        opacity: 0;
        transition: opacity 120ms linear;
      }
      #readout.ready {
        opacity: 1;
      }

      .headline {
        display: flex;
        align-items: baseline;
        gap: 0.25em;
        font-size: var(--size, 88px);
      }

      #count {
        font-variant-numeric: tabular-nums;
      }
      #count.bump {
        animation: bump 520ms ease-out;
      }
      @keyframes bump {
        0% {
          transform: scale(1);
        }
        30% {
          transform: scale(1.16);
          color: var(--pulse, #4ade80);
        }
        100% {
          transform: scale(1);
        }
      }

      #label {
        font-size: calc(var(--size, 88px) * 0.34);
        font-weight: 700;
        opacity: 0.95;
      }

      #bar {
        width: calc(var(--size, 88px) * 3.6);
        max-width: 100%;
        height: calc(var(--size, 88px) * 0.09);
        min-height: 4px;
        margin-top: 0.28em;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.24);
        overflow: hidden;
      }
      #bar i {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: var(--color, #ffffff);
        transition: width 400ms ease-out;
      }

      #subline {
        font-size: calc(var(--size, 88px) * 0.26);
        font-weight: 600;
        opacity: 0.85;
        margin-top: 0.15em;
      }

      #done-note {
        font-size: calc(var(--size, 88px) * 0.34);
        font-weight: 800;
      }

      /* Nothing to show is better than a stale or broken number on stream. */
      [hidden] {
        display: none !important;
      }

      #readout.offline {
        opacity: 0.45;
      }

      /* Faults need to be visible while you set the source up, but must never
         be the thing your viewers see, so it stays small and out of the way.
         Start-up progress is only shown in setup mode. */
      #status {
        position: absolute;
        left: 16px;
        top: 12px;
        max-width: calc(100% - 32px);
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(120, 20, 24, 0.92);
        color: #ffdcdc;
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        line-height: 1.4;
      }
      #status[data-tone='info'] {
        background: rgba(16, 20, 26, 0.85);
        color: #d5dde6;
      }

      @media (prefers-reduced-motion: reduce) {
        #count.bump {
          animation: none;
        }
        #bar i {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <video id="video" playsinline muted></video>
    <canvas id="stage"></canvas>

    <div id="readout">
      <div class="headline">
        <span id="count">—</span>
        <span id="label">PUSH-UPS LEFT</span>
      </div>
      <div id="bar" hidden><i></i></div>
      <div id="subline" hidden></div>
      <div id="done-note" hidden>ALL DONE 🎉</div>
    </div>

    <div id="status" hidden></div>

    <script type="module" src="/js/overlay.js"></script>
  </body>
</html>
