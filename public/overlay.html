<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Push-Up Tracker</title>
    <style>
      /* Transparent all the way down. OBS composites the panel straight over
         the scene, alpha channel and all — no chroma key, no custom CSS. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        height: 100%;
      }

      /* The camera feed is decoded here and drawn into the canvas. Never shown
         directly, so the tile can be rounded, mirrored and masked. */
      #video {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      #panel {
        height: 100%;
        display: flex;
        align-items: center;
        gap: clamp(14px, 2.2vw, 30px);
        padding: 14px;
        font-family: var(--font, 'Inter', 'Helvetica Neue', Arial, sans-serif);
        color: var(--color, #ffffff);
        -webkit-font-smoothing: antialiased;
        /* Held back until the URL options have been applied, so nothing flashes
           at the wrong size while the module loads. */
        opacity: 0;
        transition: opacity 140ms linear;
      }
      #panel.ready {
        opacity: 1;
      }
      #panel.offline {
        opacity: 0.45;
      }

      /* ---- the camera tile ---- */
      #tile {
        position: relative;
        height: 100%;
        /* Matches a 1280x720 webcam, so `object-fit: cover` has nothing to
           crop. Capped so the tile cannot crowd the number out on a short,
           wide browser source. */
        aspect-ratio: 16 / 9;
        max-width: 62%;
        flex: none;
        border-radius: var(--radius, 18px);
        overflow: hidden;
        background: rgba(8, 11, 14, 0.55);
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.16),
          0 10px 30px rgba(0, 0, 0, 0.45);
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      body[data-mirror='1'] #stage {
        transform: scaleX(-1);
      }
      body[data-video='0'] #tile {
        display: none;
      }

      /* A quiet ring that pulses when a rep lands, so the tile itself
         acknowledges the push-up rather than only the number moving. */
      #tile::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: inset 0 0 0 0 rgba(74, 222, 128, 0);
        pointer-events: none;
        transition: box-shadow 420ms ease-out;
      }
      #tile.rep::after {
        box-shadow: inset 0 0 0 5px rgba(74, 222, 128, 0.9);
        transition: box-shadow 60ms ease-out;
      }

      /* ---- the readout ---- */
      #readout {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
        text-shadow: var(--shadow, 0 2px 12px rgba(0, 0, 0, 0.8));
      }

      #count {
        font-size: var(--size, 88px);
        font-weight: var(--weight, 800);
        line-height: 1;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      #count.bump {
        animation: bump 520ms ease-out;
      }
      @keyframes bump {
        0% {
          transform: scale(1);
        }
        30% {
          transform: scale(1.14);
          color: var(--pulse, #4ade80);
        }
        100% {
          transform: scale(1);
        }
      }

      #label {
        font-size: calc(var(--size, 88px) * 0.22);
        font-weight: 700;
        letter-spacing: 0.09em;
        opacity: 0.92;
        margin-top: 0.35em;
        white-space: nowrap;
      }

      #progress {
        display: flex;
        align-items: center;
        gap: 0.6em;
        margin-top: 0.55em;
        font-size: calc(var(--size, 88px) * 0.17);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        opacity: 0.9;
        white-space: nowrap;
      }

      #bar {
        width: calc(var(--size, 88px) * 2.6);
        max-width: 100%;
        height: calc(var(--size, 88px) * 0.085);
        min-height: 5px;
        flex: none;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.22);
        overflow: hidden;
      }
      #bar i {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: var(--color, #ffffff);
        transition: width 420ms ease-out;
      }

      #subline {
        font-size: calc(var(--size, 88px) * 0.19);
        font-weight: 600;
        opacity: 0.8;
        margin-top: 0.5em;
        white-space: nowrap;
      }

      /* ---- fill layout: the picture is the source, number laid over it ----
         This is what you want when the point of the source is watching
         yourself. The tile stops being a tile and becomes the whole frame. */
      body[data-layout='fill'] #panel {
        display: block;
        padding: 0;
        position: relative;
      }
      body[data-layout='fill'] #tile {
        position: absolute;
        inset: 0;
        height: 100%;
        width: 100%;
        max-width: none;
        aspect-ratio: auto;
        box-shadow: none;
      }
      body[data-layout='fill'] #readout {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 2.2em 1.1em 0.9em;
        /* Footage is unpredictable; without a scrim the number lands on a
           bright patch sooner or later and stops being readable. */
        background: linear-gradient(to top, rgba(6, 9, 12, 0.82), rgba(6, 9, 12, 0));
        z-index: 2;
        pointer-events: none;
      }
      body[data-layout='fill'] #picker {
        pointer-events: auto;
      }
      /* With the picture filling the frame, the detector readout would land on
         top of the number. Put it at the other end. */
      body[data-layout='fill'] #tune {
        top: 0;
        bottom: auto;
      }
      /* With no picture there is nothing to lay the number over. */
      body[data-layout='fill'][data-video='0'] #readout {
        position: static;
        background: none;
        padding: 14px;
      }

      /* ---- setup-only camera picker ---- */
      #picker {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 1.1em;
        font-size: 13px;
        font-weight: 500;
        text-shadow: none;
      }
      #picker label {
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.65;
        font-weight: 700;
      }
      #camera-select {
        font: inherit;
        font-size: 13px;
        max-width: 260px;
        padding: 6px 9px;
        border-radius: 8px;
        color: #f2f5f8;
        background: rgba(10, 14, 18, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.22);
      }
      #camera-select:focus-visible {
        outline: 2px solid #3ddc84;
        outline-offset: 2px;
      }
      #picker-note {
        font-size: 11.5px;
        opacity: 0.7;
        flex-basis: 100%;
      }

      /* ---- setup-only detector readout ---- */
      #tune {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 7px 10px;
        background: rgba(8, 11, 14, 0.78);
        font-size: 12px;
        line-height: 1.45;
        font-variant-numeric: tabular-nums;
        color: #d5dde6;
      }
      #tune b {
        color: #fff;
      }

      /* Faults must be visible while you set the source up, but must never be
         the thing your viewers see, so it stays small and out of the way. */
      #status {
        position: absolute;
        left: 14px;
        top: 12px;
        max-width: calc(100% - 28px);
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(120, 20, 24, 0.92);
        color: #ffdcdc;
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        line-height: 1.4;
      }
      #status[data-tone='info'] {
        background: rgba(16, 20, 26, 0.86);
        color: #d5dde6;
      }

      [hidden] {
        display: none !important;
      }

      @media (prefers-reduced-motion: reduce) {
        #count.bump {
          animation: none;
        }
        #bar i,
        #tile::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <video id="video" playsinline muted></video>

    <div id="panel">
      <div id="tile">
        <canvas id="stage"></canvas>
        <div id="tune" hidden></div>
      </div>
      <div id="readout">
        <span id="count">—</span>
        <span id="label">PUSH-UPS LEFT</span>
        <div id="progress" hidden>
          <div id="bar"><i></i></div>
          <span id="progress-text"></span>
        </div>
        <div id="subline" hidden></div>
        <!-- Setup only. Never rendered on stream. -->
        <div id="picker" hidden>
          <label for="camera-select">Camera</label>
          <select id="camera-select"></select>
          <span id="picker-note"></span>
        </div>
      </div>
    </div>

    <div id="status" hidden></div>

    <script type="module" src="/js/overlay.js"></script>
  </body>
</html>
