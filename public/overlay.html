<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Push-Up Counter Overlay</title>
    <style>
      /* Transparent all the way down — OBS composites this straight over the scene. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }

      #stage {
        display: flex;
        flex-direction: column;
        gap: 0.1em;
        padding: 12px 16px;
        font-family: var(--font, 'Inter', 'Helvetica Neue', Arial, sans-serif);
        font-weight: var(--weight, 800);
        color: var(--color, #ffffff);
        text-shadow: var(--shadow, 0 2px 10px rgba(0, 0, 0, 0.75));
        line-height: 1.05;
        letter-spacing: -0.01em;
        text-align: var(--align, left);
        align-items: var(--items, flex-start);
        -webkit-font-smoothing: antialiased;
      }

      .headline {
        display: flex;
        align-items: baseline;
        gap: 0.25em;
        font-size: var(--size, 88px);
      }

      /* The count itself gets a quick pop whenever it changes. */
      #count {
        font-variant-numeric: tabular-nums;
        transition: transform 180ms ease-out;
        transform-origin: center;
      }
      #count.bump-up {
        animation: bump-up 520ms ease-out;
      }
      #count.bump-down {
        animation: bump-down 520ms ease-out;
      }
      @keyframes bump-up {
        0% {
          transform: scale(1);
        }
        30% {
          transform: scale(1.16);
          color: var(--up-color, #ff5a5a);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes bump-down {
        0% {
          transform: scale(1);
        }
        30% {
          transform: scale(1.16);
          color: var(--down-color, #4ade80);
        }
        100% {
          transform: scale(1);
        }
      }

      .label {
        font-size: calc(var(--size, 88px) * 0.34);
        font-weight: 700;
        opacity: 0.95;
      }

      .subline {
        font-size: calc(var(--size, 88px) * 0.26);
        font-weight: 600;
        opacity: 0.85;
      }

      /* Nothing to show is better than a stale or broken number on stream. */
      [hidden] {
        display: none !important;
      }

      #stage.offline {
        opacity: 0.45;
      }

      #done-note {
        font-size: calc(var(--size, 88px) * 0.34);
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="headline">
        <span id="count">—</span>
        <span class="label" id="label">PUSH-UPS LEFT</span>
      </div>
      <div class="subline" id="subline" hidden></div>
      <div id="done-note" hidden>ALL DONE 🎉</div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const stage = document.getElementById('stage');
      const countEl = document.getElementById('count');
      const labelEl = document.getElementById('label');
      const sublineEl = document.getElementById('subline');
      const doneNote = document.getElementById('done-note');

      // ---- look & feel, all driven by URL query params -------------------
      const styleVars = {
        size: (v) => (/^\d+$/.test(v) ? `${v}px` : v),
        color: (v) => v,
        font: (v) => v,
        weight: (v) => v,
        align: (v) => v,
        shadow: (v) => (v === 'none' ? 'none' : v),
        'up-color': (v) => v,
        'down-color': (v) => v,
      };
      for (const [key, normalize] of Object.entries(styleVars)) {
        const value = params.get(key);
        if (value) stage.style.setProperty(`--${key}`, normalize(value));
      }
      if (params.get('align') === 'center') stage.style.setProperty('--items', 'center');
      if (params.get('align') === 'right') stage.style.setProperty('--items', 'flex-end');

      const labelText = params.get('label');
      if (labelText !== null) {
        labelEl.textContent = labelText;
        labelEl.hidden = labelText === '';
      }

      const showSubs = params.get('subs') === '1';
      const numberOnly = params.get('numberonly') === '1';
      if (numberOnly) labelEl.hidden = true;

      const format = (n) => n.toLocaleString('en-US');

      let lastRemaining = null;

      function render(state) {
        stage.classList.remove('offline');

        const remaining = state.remaining;
        countEl.textContent = format(remaining);

        if (lastRemaining !== null && remaining !== lastRemaining) {
          const cls = remaining > lastRemaining ? 'bump-up' : 'bump-down';
          countEl.classList.remove('bump-up', 'bump-down');
          void countEl.offsetWidth; // restart the animation
          countEl.classList.add(cls);
        }
        lastRemaining = remaining;

        doneNote.hidden = !(remaining === 0 && !numberOnly);

        if (showSubs && state.subs !== null) {
          const gained = state.subsGained;
          sublineEl.textContent =
            `${format(state.subs)} subs` +
            (gained ? ` · ${gained > 0 ? '+' : ''}${format(gained)} this stream` : '');
          sublineEl.hidden = false;
        } else {
          sublineEl.hidden = true;
        }
      }

      // ---- live updates over server-sent events ---------------------------
      let source;
      let retry;

      // Paint immediately rather than showing a dash until the first event.
      fetch('/api/state')
        .then((res) => res.json())
        .then((state) => {
          if (lastRemaining === null) render(state);
        })
        .catch(() => {});

      function connect() {
        source = new EventSource('/api/events');
        source.onmessage = (event) => {
          clearTimeout(retry);
          render(JSON.parse(event.data));
        };
        source.onerror = () => {
          // The server restarted or OBS lost the page — dim it and retry.
          source.close();
          stage.classList.add('offline');
          clearTimeout(retry);
          retry = setTimeout(connect, 2000);
        };
      }

      connect();
    </script>
  </body>
</html>
